<!doctype html>
<html><head><meta charset="utf-8">
<title>GARDEN: engine creatures (reference mockup)</title>
<!-- Reference mockup for the GARDEN UI (docs/garden-handoff/INSTRUCTIONS.md §6). Approved by the user.
     Open normally for the live animation, or ?shot&t=2.5&lvl=70 for one fixed frame in a 4-column grid of 240 px tiles. -->
<style>
  body { margin:0; font:13px/1.4 system-ui, sans-serif; color:#2B1E16; background:#fff; padding:12px; }
  .wrap { display:grid; grid-template-columns: repeat(3, 360px); gap:18px; padding:8px 0; justify-content:start; }
  .cell { display:flex; flex-direction:column; gap:6px; }
  .lbl { font-weight:600; letter-spacing:.04em; }
  .lbl small { font-weight:400; color:#6b5a4c; }
  canvas { width:360px; height:360px; image-rendering:pixelated; border-radius:14px; border:2px solid #2B1E16; display:block; }
  .ctl { display:flex; gap:10px; align-items:center; font-size:12px; margin:4px 0 10px; }
  input[type=range] { width:200px; }
  body.shot { padding:0; }
  body.shot .ctl, body.shot .lbl { display:none; }
  body.shot .wrap { grid-template-columns: repeat(4, 240px); gap:0; padding:0; }
  body.shot .cell { gap:0; }
  body.shot canvas { width:240px; height:240px; border:0; border-radius:0; }
</style></head>
<body>
<div class="ctl">Music level <input id="lvl" type="range" min="0" max="100" value="70"></div>
<div class="wrap" id="wrap"></div>
<script>
const QS = new URLSearchParams(location.search);
const C = { bg:'#F3ECDF', surf:'#E6DAC4', ink:'#2B1E16', blue:'#3F6FA8', pblue:'#A9CBEA',
            orange:'#F5A66B', burnt:'#C8602A', mid:'#6b5a4c', line:'#d6c9b2',
            dirt:'#C2A07E', dirtLt:'#D9C2A6', dirtDk:'#A6876A' };
const SHADES = [C.dirtLt, '', C.dirt, '', C.dirtDk];
const lvlEl = document.getElementById('lvl');
if (QS.has('lvl')) lvlEl.value = QS.get('lvl');
const BPM = 120, PIX = 2;
let ctx;
// creatures are drawn to this layer first, then copied back in 2 px blocks (the soft pixel look);
// on the device draw them on a 2 px grid instead (there is no framebuffer to read back)
const layer = document.createElement('canvas'); layer.width = 240; layer.height = 240;
const lctx = layer.getContext('2d', { willReadFrequently: true });
// simulated music: a beat envelope + two tones, 0..1 (on the device: the output level envelope)
function music(t) {
  const beat = t * 2;
  const env = Math.pow(1 - (beat % 1), 3);
  const bass = 0.5 + 0.5 * Math.sin(t * Math.PI);
  const lead = 0.5 + 0.5 * Math.sin(t * 2 * Math.PI * 1.7 + Math.sin(t * 0.9) * 2);
  return Math.min(1, env * 0.55 + bass * 0.25 + lead * 0.2) * (+lvlEl.value / 100);
}
// the motion rate: 0.2 of normal speed in silence, 2x at a full music level
function rateOf(e) { return 0.2 + 1.8 * e; }
function beatPulse(t) { return Math.pow(1 - ((t * BPM / 60) % 1), 2); }
function lerpHex(a, b, k) {
  const p = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join('');
}
SHADES[1] = lerpHex(C.dirtLt, C.dirt, 0.5); SHADES[3] = lerpHex(C.dirt, C.dirtDk, 0.5);
function rnd(s) { return (Math.sin(s * 127.1 + 311.7) * 43758.5453) % 1 * 0.5 + 0.5; }
// smooth value noise on an integer hash (a sine hash streaks diagonally: do not use one for the soil)
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const h = (a, b) => { let s = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263); s = Math.imul(s ^ (s >>> 13), 1274126177); return ((s ^ (s >>> 16)) >>> 0) / 4294967295; };
  const top = h(xi, yi) + (h(xi + 1, yi) - h(xi, yi)) * u;
  const bot = h(xi, yi + 1) + (h(xi + 1, yi + 1) - h(xi, yi + 1)) * u;
  return top + (bot - top) * v;
}
function poly(pts, col) {
  ctx.fillStyle = col; ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath(); ctx.fill();
}
// a wobbly n-sided blob (never a plain circle)
function blob(x, y, r, n, col, e, seed, sx = 1, sy = 1) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    const k = 1 + 0.14 * Math.sin(a * 3 + seed) + 0.1 * e * Math.sin(a * 5 + seed * 1.7);
    pts.push([x + Math.cos(a) * r * k * sx, y + Math.sin(a) * r * k * sy]);
  }
  poly(pts, col);
}
// an irregular blob: each point its own random radius, never symmetrical
function blobI(x, y, r, n, col, seed, amp = 0.3, rot = 0) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + rot;
    const k = 1 + amp * (rnd(seed * 13 + i * 7) - 0.5) * 2;
    pts.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k * (0.8 + 0.4 * rnd(seed + i))]);
  }
  poly(pts, col);
}
function leaf(x, y, a, L, W, col, vein = C.ink) {
  if (L < 1) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.bezierCurveTo(L * 0.3, -W, L * 0.75, -W * 0.9, L, 0);
  ctx.bezierCurveTo(L * 0.75, W * 0.9, L * 0.3, W, 0, 0); ctx.fill();
  ctx.strokeStyle = vein; ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(1, 0); ctx.lineTo(L * 0.8, 0); ctx.stroke();
  ctx.restore();
}
function line(x0, y0, x1, y1, col, w = 2) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.lineWidth = 1;
}
// the shared scene behind every creature: sky gradient, matte soil in five tones, a grass line, swaying tufts
function scene(t, e) {
  for (let y = 0; y < 186; y += 2) ctx.fillStyle = lerpHex(C.bg, '#A9CBEA', Math.pow(1 - y / 186, 1.4)), ctx.fillRect(0, y, 240, 2);
  const P = 3;
  for (let x = 0; x < 240; x += P) for (let y = 182; y < 240; y += P) {
    const d = y - 182;
    const n = 0.5 + 0.55 * (0.8 * vnoise(x / 10, y / 10) + 0.2 * vnoise(x / 5 + 7, y / 5 + 3) - 0.5);
    const checker = ((x / P + y / P) & 1) ? 0.015 : -0.015;
    const v = 0.8 * n + 0.2 * Math.min(1, d / 40) + checker;
    ctx.fillStyle = SHADES[Math.max(0, Math.min(4, Math.floor(v * 5)))];
    ctx.fillRect(x, y, P, P);
  }
  ctx.fillStyle = C.dirtLt; ctx.fillRect(0, 182, 240, 3);
  for (let x = 6; x < 240; x += 18) {
    const h = 4 + 3 * e * (0.5 + 0.5 * Math.sin(t * 3 + x * 0.2));
    ctx.fillStyle = C.blue; ctx.fillRect(x + Math.sin(t * 2 + x) * 1.5, 178 - h + 4, 3, h);
  }
}
function creature(target, fn, t, e) {
  lctx.clearRect(0, 0, 240, 240);
  ctx = lctx; fn(t, e);
  ctx = target;
  const d = lctx.getImageData(0, 0, 240, 240).data;
  for (let by = 0; by < 240; by += PIX) for (let bx = 0; bx < 240; bx += PIX) {
    const i = (by * 240 + bx) * 4, a = d[i + 3];
    if (a < 8) continue;
    ctx.fillStyle = `rgba(${d[i]},${d[i + 1]},${d[i + 2]},${a / 255})`;
    ctx.fillRect(bx, by, PIX, PIX);
  }
}
function shell(x, y, w, h, col, e, seed, hit) {
  poly([[x - w / 2, y], [x + w / 2, y], [x + w / 2, y + h], [x - w / 2, y + h]], col);
  blob(x, y, w / 2, 8, C.surf, e, seed, 1, 0.28 + 0.1 * hit);
  line(x - w / 2, y + h, x + w / 2, y + h, C.burnt, 1.5);
}
// DRUM: a JIANT-like kit; hi-hats close on the beat, toms and snare bounce, the kick jumps
function drum(t, e) {
  const beat = (t * BPM / 60) % 1, hit = Math.pow(1 - beat, 4), kick = Math.pow(1 - beat, 6);
  line(40, 100, 40, 178, C.ink, 1.5);
  blob(40, 96 + hit * 4, 15, 8, C.orange, e, 1, 1, 0.3);
  blob(40, 104 - hit * 2, 15, 8, C.pblue, e, 2, 1, 0.3);
  line(204, 74, 204, 176, C.ink, 1.5);
  blob(204, 70, 17, 8, C.pblue, e, 3, 1, 0.3);
  shell(90, 118 + hit * 2, 40, 20, C.blue, e, 4, hit);
  shell(150, 118 + hit * 2, 40, 20, C.burnt, e, 5, hit);
  shell(66, 150 + hit * 2, 30, 14, C.surf, e, 6, hit);
  const ky = 176 - 34 - kick * 3;
  poly([[92 + 4, ky], [148 - 4, ky], [148 - 4, ky + 34], [92 + 4, ky + 34]], C.orange);
  blob(120, ky + 17, 22, 9, C.surf, e, 7, 0.9, 0.9);
  blob(120, ky + 17, 8, 7, C.burnt, e, 8);
}
// VOICE: a singing flower with a face; notes leave its mouth only while there is music
function voice(t, e) {
  const cx = 120, cy = 100, gate = Math.min(1, Math.max(0, (e - 0.05) / 0.2));
  for (let i = 0; i < 7; i++) leaf(cx, cy, i / 7 * Math.PI * 2 + t * 0.2, 26 + 3 * e, 10, i % 2 ? C.orange : C.surf, C.burnt);
  line(cx, cy + 22, cx, 178, C.ink, 2);
  leaf(cx, 150, -0.8, 20, 6, C.blue, C.surf);
  blob(cx, cy, 18, 9, C.burnt, e, 3);
  ctx.fillStyle = C.ink; ctx.fillRect(cx - 8, cy - 6, 3, 4); ctx.fillRect(cx + 4, cy - 6, 3, 4);
  const mx = cx + 10, my = cy + 6;
  blob(mx, my, 4, 6, C.ink, 0, 4, 1, 0.25 + 0.9 * e);
  for (let k = 0; k < 6; k++) {
    const age = (t * 0.7 + k / 6) % 1;
    const x = mx + 5 + age * (50 + 40 * e), y = my - 6 * Math.sin(age * 5 + k) - age * 14;
    const size = 1.5 + 2 * e;
    ctx.globalAlpha = (1 - age) * gate * 0.9;
    ctx.fillStyle = C.pblue;
    ctx.fillRect(Math.round(x), Math.round(y), size, size);
    ctx.fillRect(Math.round(x + size), Math.round(y - 4), 1, 4);
  }
  ctx.globalAlpha = 1;
}
// ANIMAL: a beetle; legs step, the body hops on the beat
function animal(t, e) {
  const beat = (t * BPM / 60) % 1, hop = Math.pow(Math.abs(Math.sin(beat * Math.PI)), 2) * (2 + 4 * e);
  const x = 120, y = 146 - hop;
  for (let i = -1; i <= 1; i++) {
    const s = (i % 2 ? 1 : -1) * Math.sin(t * 9) * 4;
    line(x + i * 16, y + 12, x + i * 16 + s, 176, C.ink, 1.5);
    line(x + i * 16, y - 12, x + i * 16 - s, 176 - 2 * hop, C.ink, 1.5);
  }
  line(x - 40, y - 26, x - 56, y - 42 - Math.sin(t * 6) * 3, C.ink, 1.2);
  line(x - 40, y - 26, x - 52, y - 40 + Math.cos(t * 6) * 3, C.ink, 1.2);
  blob(x, y, 36, 10, C.burnt, e, 5, 1.35, 1);
  line(x - 42, y, x + 42, y, C.surf, 1.5);
  blob(x - 14, y - 12, 5, 6, C.ink, 0, 2);
  blob(x + 14, y + 12, 4, 6, C.ink, 0, 4);
  blob(x - 48, y, 11, 8, C.ink, 0, 7);
  ctx.fillStyle = C.pblue; ctx.fillRect(x - 18, y - 16, 2, 2);
}
// LOFI: an apple orbiting on a dotted path, changing size and squash as it turns
function lofi(t, e) {
  const a = t * 0.8;
  const cx = 120 + 56 * Math.cos(a), cy = 124 + 28 * Math.sin(a);
  const sc = 1 + 0.1 * Math.sin(a), squash = 1 - 0.12 * Math.sin(a * 2 + 1);
  ctx.strokeStyle = C.mid; ctx.globalAlpha = 0.4; ctx.setLineDash([2, 3]);
  ctx.beginPath(); ctx.ellipse(120, 124, 56, 28, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  line(cx, cy - 30 * sc, cx + 5, cy - 42 * sc, C.ink, 2);
  leaf(cx + 5, cy - 40 * sc, -0.6 + a, 28, 10, C.blue, C.surf);
  blob(cx, cy, 30 * sc + e * 2, 10, C.burnt, e, 7 + Math.floor(a), 1 + 0.08 * Math.sin(a * 2), squash);
  ctx.fillStyle = C.pblue; ctx.fillRect(Math.round(cx - 18), Math.round(cy - 14), 5, 4);
}
// ANALOG: a whimsical irregular orange being with a face, off-centre swirls, uneven orbiting dots
function analog(t, e) {
  const cx = 120, cy = 126, wob = Math.sin(t * 1.3) * 3;
  blobI(cx, cy, 44 + 4 * e, 9, C.orange, 4, 0.22, t * 0.2);
  blobI(cx + 18, cy - 20, 16, 7, C.orange, 9, 0.25);
  ctx.strokeStyle = C.surf; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let j = 0; j < 22; j++) { const a = j * 0.3 + t * 0.6, r = 10 + j * 0.9; j ? ctx.lineTo(cx - 8 + r * Math.cos(a) * 0.7, cy + 10 + r * Math.sin(a) * 0.5) : ctx.moveTo(cx - 8 + r * Math.cos(a) * 0.7, cy + 10 + r * Math.sin(a) * 0.5); }
  ctx.stroke(); ctx.lineWidth = 1;
  blob(cx - 14, cy - 8 + wob, 5, 6, C.ink, 0, 2);
  blob(cx + 12, cy - 12 + wob, 4, 6, C.ink, 0, 3);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx + 2, cy + 6, 7 + 3 * e, 0.2, 2.9); ctx.stroke(); ctx.lineWidth = 1;
  blob(cx - 24, cy + 6, 4, 6, C.pblue, 0, 5); blob(cx + 26, cy + 4, 3, 6, C.pblue, 0, 6);
  for (let k = 0; k < 3; k++) {
    const a = t * (1.1 - k * 0.3) + k * 2.1, rr = 66 + k * 9 + 4 * Math.sin(t + k);
    ctx.fillStyle = k % 2 ? C.blue : C.burnt;
    ctx.fillRect(Math.round(cx + rr * Math.cos(a)), Math.round(cy + rr * 0.55 * Math.sin(a)), 3, 3);
  }
}
// FM6: a band of five small fuzzy flowers, each bobbing on its own phase
function fm6(t, e) {
  for (let i = 0; i < 5; i++) {
    const x = 36 + i * 42, y = 140 + Math.sin(t * 2 + i) * 5;
    line(x, y + 8, x, 178, C.ink, 1.2);
    for (let k = 0; k < 6; k++) leaf(x, y, k / 6 * Math.PI * 2 + t * 0.3, 10 + e * 2, 4, i % 2 ? C.pblue : C.orange, C.pblue);
    for (let m = 0; m < 8; m++) {
      const a = m * 0.8 + i, r = 13 + 2 * Math.sin(t * 5 + m);
      ctx.fillStyle = C.pblue; ctx.fillRect(Math.round(x + r * Math.cos(a)), Math.round(y + r * Math.sin(a)), 2, 2);
    }
    blob(x, y, 4, 6, C.burnt, e, i + 3);
  }
}
// PHASE: a black hole; orange photon ring, black core, four tilted 3D rings (far halves behind the core,
// near halves in front), each turning at its own speed and direction, pulsing with the beat and level,
// kept above the ground (clipped at y 178)
function phase(t, e) {
  const cx = 120, cy = 96, p = beatPulse(t);
  const grow = 1 + 0.05 * e + 0.08 * e * p;
  const rings = [0, 1, 2, 3].map(i => ({
    rx: (36 + i * 11) * grow, ry: (14 + i * 4) * 0.55 * (1 + 0.1 * e * p),
    rot: 0.25 + i * 0.12 + t * (0.25 + 0.2 * i) * (i % 2 ? 1 : -1), col: i % 2 ? C.orange : C.blue
  }));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 240, 178); ctx.clip();
  rings.forEach(r => { ctx.strokeStyle = r.col; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.ellipse(cx, cy, r.rx, r.ry, r.rot, Math.PI, Math.PI * 2); ctx.stroke(); });
  blobI(cx, cy, (28 + 3 * e + 2 * p * e), 12, C.orange, 2, 0.06);
  blob(cx, cy, 22 + 2 * p * e, 12, C.ink, 0, 1);
  rings.forEach(r => { ctx.strokeStyle = r.col; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.ellipse(cx, cy, r.rx, r.ry, r.rot, 0, Math.PI); ctx.stroke(); });
  ctx.restore(); ctx.lineWidth = 1;
}
// WHEEL: a barn wheel rolling along the ground; rim irregularity and spokes turn with the distance covered
function wheel(t, e) {
  const R = 50, speed = 28, travel = t * speed;
  const cx = ((travel + 40) % 320) - 40, cy = 132, rot = travel / R;
  const rimR = a => R * (1 + 0.05 * Math.sin(4 * (a + rot)) + 0.03 * Math.sin(7 * (a + rot) + 1));
  ctx.fillStyle = C.dirtDk; ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.ellipse(cx + 4, 184, R * 0.9, 4, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  const ringPath = off => { ctx.beginPath();
    for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2, r = rimR(a) - off; i ? ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)) : ctx.moveTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); }
    ctx.closePath(); };
  ctx.strokeStyle = C.burnt; ctx.lineWidth = 9; ringPath(0); ctx.stroke();
  ctx.strokeStyle = C.dirtDk; ctx.lineWidth = 2; ringPath(6); ctx.stroke(); ctx.lineWidth = 1;
  for (let k = 0; k < 11; k++) {
    const a = rot + k * Math.PI * 2 / 11 + (rnd(k * 5) - 0.5) * 0.12;
    const d = [Math.cos(a), Math.sin(a)], pp = [-Math.sin(a), Math.cos(a)];
    const h = 12, tip = R - 6 - (rnd(k * 9) * 4), wb = 4 + rnd(k * 3) * 1.5, wt = 2 + rnd(k * 7);
    poly([
      [cx + d[0] * h + pp[0] * wb, cy + d[1] * h + pp[1] * wb],
      [cx + d[0] * tip + pp[0] * wt, cy + d[1] * tip + pp[1] * wt],
      [cx + d[0] * tip - pp[0] * wt, cy + d[1] * tip - pp[1] * wt],
      [cx + d[0] * h - pp[0] * wb, cy + d[1] * h - pp[1] * wb]
    ], k % 2 ? C.dirtDk : C.burnt);
  }
  blob(cx, cy, 15, 10, C.ink, 0, 9, 1, 0.9);
  blob(cx, cy, 11, 10, C.burnt, e, 10, 1, 0.9);
  blob(cx, cy, 3.5, 6, C.dirtDk, 0, 11);
}
// NOISE: a tilted spiral galaxy with a spiky sun and three planets (one ringed), each at its own speed
function noise(t, e) {
  const cx = 120, cy = 122;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(1, 0.55);
  for (let i = 0; i < 140; i++) {
    const a = i * 0.13 + t * 0.25, r = 6 + i * 0.32;
    ctx.fillStyle = i % 3 ? C.pblue : C.blue;
    ctx.fillRect(Math.round(r * Math.cos(a)), Math.round(r * Math.sin(a)), 2, 2);
  }
  ctx.restore();
  const sr = 11 + 3 * e, star = [];
  for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, r = i % 2 ? sr * 0.7 : sr * 1.2; star.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  poly(star, C.orange);
  blob(cx, cy, sr * 0.55, 7, C.burnt, e, 6);
  [[50, 0.8, 5, C.burnt, false], [74, 0.5, 7, C.blue, true], [96, 0.3, 4, C.dirt, false]].forEach(([rp, sp, size, col, ring], k) => {
    const a = t * sp + k * 2, px = cx + rp * Math.cos(a), py = cy + rp * 0.4 * Math.sin(a);
    if (ring) { ctx.strokeStyle = C.burnt; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(px, py, size * 2, size * 0.5, 0.3, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1; }
    blob(px, py, size, 7, col, e, k + 2);
  });
}
// SERUM: pixel-art bushes (3 px blocks, light top, dark base, a few berries); they swell only with the music
function bush(bx, by, W0, H0, seed, t, e) {
  const p = beatPulse(t), s = 1 + 0.14 * e * (0.4 + 0.6 * p);
  const W = W0 * s, H = H0 * s, sway = Math.sin(t * 2 + seed) * 1.5 * e;
  for (let py = by - H; py < by; py += 3) for (let px = bx - W / 2; px < bx + W / 2; px += 3) {
    const u = (px - bx) / (W / 2), v = (by - py) / H;
    if (u * u + v * v * 0.9 > 1 + 0.3 * (rnd(seed * 3 + px * 0.7 + py * 1.3) - 0.5)) continue;
    const shade = v > 0.72 ? C.pblue : v < 0.3 ? lerpHex(C.blue, C.ink, 0.35) : C.blue;
    ctx.fillStyle = rnd(px * 5 + py * 3 + seed) > 0.85 && v > 0.4 ? C.pblue : shade;
    ctx.fillRect(Math.round(px + sway), Math.round(py), 3, 3);
  }
  for (let k = 0; k < 3; k++) {
    const px = bx + (rnd(seed * 7 + k) - 0.5) * W * 0.6, py = by - H * (0.3 + 0.4 * rnd(seed + k * 3));
    if (rnd(seed + k * 11) > 0.5) { ctx.fillStyle = C.orange; ctx.fillRect(Math.round(px + sway), Math.round(py), 3, 3); }
  }
}
function serum(t, e) {
  bush(44, 176, 56, 40, 1, t, e);
  bush(120, 178, 78, 56, 2, t, e);
  bush(196, 176, 56, 40, 3, t, e);
  bush(84, 182, 34, 22, 4, t, e);
  bush(156, 182, 34, 22, 5, t, e);
}
// USER: a face inside an irregular halo (the halo does not follow the face); brows lift on each beat
function face(t, e) {
  const cx = 120, cy = 118, p = beatPulse(t);
  blobI(cx + 4, cy - 2, 80 + 6 * e, 11, C.pblue, 3, 0.2, 0.4);
  blobI(cx - 10, cy + 8, 62, 8, C.surf, 7, 0.14, 1.1);
  blob(cx, cy, 52, 10, C.surf, e, 1, 0.96, 1.04);
  blob(cx - 30, cy + 18, 8, 6, C.orange, e, 5); blob(cx + 30, cy + 18, 8, 6, C.orange, e, 6);
  const blink = (t % 3.2) > 3.0;
  ctx.fillStyle = C.ink;
  if (blink) { ctx.fillRect(cx - 26, cy - 8, 12, 1); ctx.fillRect(cx + 14, cy - 8, 12, 1); }
  else { ctx.fillRect(cx - 24, cy - 12, 4, 8); ctx.fillRect(cx + 20, cy - 12, 4, 8); }
  const lift = 4 * p;
  line(cx - 26, cy - 20 - lift, cx - 14, cy - 22 - lift, C.burnt, 2);
  line(cx + 14, cy - 22 - lift, cx + 26, cy - 20 - lift, C.burnt, 2);
  blob(cx, cy + 28, 9, 6, C.ink, 0, 2, 1.4, 0.3 + 0.9 * e);
}
const CREATURES = [
  ['DRUM', 'drumset: hi-hat, crash, toms, snare, kick', drum],
  ['VOICE', 'a singing flower; notes drift from the mouth', voice],
  ['ANIMAL', 'a beetle', animal],
  ['LOFI', 'an apple that orbits and changes shape', lofi],
  ['ANALOG', 'a whimsical irregular being with a face', analog],
  ['FM6', 'a band of small fuzzy flowers', fm6],
  ['PHASE', 'a black hole with pulsing 3D rings', phase],
  ['WHEEL', 'a barn wheel, rolling', wheel],
  ['NOISE', 'a galaxy with a sun and planets', noise],
  ['SERUM', 'pulsing pixel serumbery', serum],
  ['USER', 'a face; brows pulse to the tempo', face],
];
const wrap = document.getElementById('wrap');
const cells = CREATURES.map(([name, sub, fn]) => {
  const cell = document.createElement('div'); cell.className = 'cell';
  cell.innerHTML = `<div class="lbl">${name} <small>${sub}</small></div>`;
  const cv = document.createElement('canvas'); cv.width = 240; cv.height = 240;
  cell.appendChild(cv); wrap.appendChild(cell);
  return [cv.getContext('2d'), fn];
});
if (QS.has('shot')) {
  document.body.classList.add('shot');
  const t = +(QS.get('t') || 2.5), e = music(t);
  cells.forEach(([c, fn]) => { ctx = c; scene(t, e); creature(c, fn, t, e); });
} else {
  let t0 = performance.now(), last = 0, prev = 0, mt = 0;
  function frame(now) {
    if (now - last >= 1000 / 15) {
      const dt = prev ? (now - prev) / 1000 : 0;
      prev = now; last = now;
      const e = music((now - t0) / 1000);
      mt += dt * rateOf(e);
      cells.forEach(([c, fn]) => { ctx = c; scene(mt, e); creature(c, fn, mt, e); });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
